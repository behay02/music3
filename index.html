<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07070d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lyric Player">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Lyric Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        /* Animated Mesh Gradient */
        body {
            background-color: #07070d;
            background-image: 
                radial-gradient(at 10% 10%, rgba(120, 50, 255, 0.3) 0px, transparent 50%),
                radial-gradient(at 90% 20%, rgba(255, 50, 120, 0.25) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(50, 150, 255, 0.25) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(255, 200, 50, 0.2) 0px, transparent 50%),
                radial-gradient(at 20% 60%, rgba(0, 255, 200, 0.15) 0px, transparent 50%);
            background-size: 300% 300%;
            animation: meshMove 18s ease-in-out infinite;
        }

        @keyframes meshMove {
            0%, 100% { background-position: 0% 0%; }
            20% { background-position: 100% 0%; }
            40% { background-position: 100% 100%; }
            60% { background-position: 0% 100%; }
            80% { background-position: 50% 50%; }
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: white;
            pointer-events: none;
            opacity: 0.3;
            animation: floatParticle 15s linear infinite;
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Glass Effect */
        .glass {
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Keyframes */
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 0 20px rgba(255,100,150,.4)} 50%{box-shadow:0 0 60px rgba(255,100,150,.8)} }
        @keyframes spinSlow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes spinFast { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes wave { 0%{transform:scaleX(.3);opacity:.2} 50%{transform:scaleX(1);opacity:.9} 100%{transform:scaleX(.3);opacity:.2} }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px) rotate(-4deg)} 40%{transform:translateX(6px) rotate(4deg)} 60%{transform:translateX(-6px) rotate(-4deg)} 80%{transform:translateX(6px) rotate(4deg)} }
        @keyframes windLine { 0%{transform:translateX(-120%);opacity:0} 30%{opacity:1} 70%{opacity:1} 100%{transform:translateX(120%);opacity:0} }
        @keyframes rocketFly { 0%,100%{transform:translateY(0) rotate(-45deg)} 50%{transform:translateY(-14px) rotate(-45deg)} }
        @keyframes sunRise { 0%{transform:translateY(14px);opacity:.6} 50%{transform:translateY(-8px);opacity:1} 100%{transform:translateY(14px);opacity:.6} }
        @keyframes heartbeat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.35)} 28%{transform:scale(1)} 42%{transform:scale(1.35)} 70%{transform:scale(1)} }
        @keyframes ecgLine { 0%{stroke-dashoffset:300} 100%{stroke-dashoffset:-300} }
        @keyframes raySpin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px) scale(.95)} to{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes textGlow { 0%,100%{text-shadow:0 0 10px rgba(255,255,255,.3), 0 0 20px rgba(180,120,255,.2)} 50%{text-shadow:0 0 25px rgba(255,200,220,.6), 0 0 40px rgba(255,100,200,.3)} }
        @keyframes floatUp { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-12px) rotate(6deg)} }
        @keyframes merge { 0%,100%{transform:translateX(0) scale(1)} 50%{transform:translateX(10px) scale(1.15)} }
        @keyframes mergeReverse { 0%,100%{transform:translateX(0) scale(1)} 50%{transform:translateX(-10px) scale(1.15)} }
        @keyframes handsReach { 0%,100%{transform:translateX(0)} 50%{transform:translateX(12px)} }
        @keyframes handsReachReverse { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-12px)} }
        @keyframes lockTurn { 0%,100%{transform:rotate(0)} 50%{transform:rotate(18deg)} }
        @keyframes keyTurn { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-28deg)} }
        @keyframes shockwave { 0%{transform:scale(.5);opacity:.8} 100%{transform:scale(2.8);opacity:0} }
        @keyframes ringPulse { 0%{transform:scale(.9);opacity:.6} 50%{transform:scale(1.4);opacity:.2} 100%{transform:scale(.9);opacity:.6} }
        @keyframes glowPulse { 0%,100%{filter:drop-shadow(0 0 4px currentColor)} 50%{filter:drop-shadow(0 0 14px currentColor)} }
        @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
        @keyframes sparkle { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.3)} }
        @keyframes wifiPulse { 0%,100%{opacity:.4} 50%{opacity:1} }

        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
        .animate-spin-slow { animation: spinSlow 8s linear infinite; }
        .animate-spin-fast { animation: spinFast 3s linear infinite; }
        .animate-wave { animation: wave 1.2s ease-in-out infinite; }
        .animate-shake { animation: shake 0.5s ease-in-out infinite; }
        .animate-wind { animation: windLine 2s linear infinite; }
        .animate-rocket { animation: rocketFly 1.5s ease-in-out infinite; }
        .animate-sun { animation: sunRise 2s ease-in-out infinite; }
        .animate-heartbeat { animation: heartbeat 1.1s ease-in-out infinite; }
        .animate-ecg { stroke-dasharray: 300; animation: ecgLine 2s linear infinite; }
        .animate-ray { animation: raySpin 10s linear infinite; }
        .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(.16,1,.3,1) forwards; }
        .animate-text-glow { animation: textGlow 2.5s ease-in-out infinite; }
        .animate-float-up { animation: floatUp 2.5s ease-in-out infinite; }
        .animate-merge { animation: merge 1.5s ease-in-out infinite; }
        .animate-merge-rev { animation: mergeReverse 1.5s ease-in-out infinite; }
        .animate-hands { animation: handsReach 1.8s ease-in-out infinite; }
        .animate-hands-rev { animation: handsReachReverse 1.8s ease-in-out infinite; }
        .animate-lock { animation: lockTurn 2s ease-in-out infinite; }
        .animate-key { animation: keyTurn 2s ease-in-out infinite; }
        .animate-shockwave { animation: shockwave 1.5s ease-out infinite; }
        .animate-ring-pulse { animation: ringPulse 2s ease-in-out infinite; }
        .animate-glow-pulse { animation: glowPulse 1.5s ease-in-out infinite; }
        .animate-breathe { animation: breathe 2s ease-in-out infinite; }
        .animate-sparkle { animation: sparkle 1.2s ease-in-out infinite; }
        .animate-wifi { animation: wifiPulse 1s ease-in-out infinite; }

        .text-lyric { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .mobile-frame {
            height: 100vh;
            height: 100dvh;
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem);
            padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
        }

        @media (min-width: 640px) {
            .mobile-frame {
                height: 880px;
                max-width: 420px;
                border-radius: 48px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding-bottom: 1.5rem;
                padding-top: 1.5rem;
            }
        }

        /* Landscape mode: компактная горизонтальная раскладка */
        @media (orientation: landscape) and (max-height: 520px) {
            .mobile-frame {
                height: 100dvh;
                max-width: 100%;
                border-radius: 0;
                border: none;
                padding: calc(env(safe-area-inset-top, 0px) + 0.5rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
                flex-direction: row;
                align-items: center;
                gap: 0.75rem;
            }
            .landscape-lyrics {
                flex: 1;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .landscape-right {
                flex: 1;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 0.75rem;
            }
            #widget-card { min-height: 140px !important; padding: 0.75rem !important; }
            #lyric-text { font-size: 1.1rem !important; }
            #lyric-translation { font-size: 0.7rem !important; }
        }

        /* Widget inner glow */
        #widget-card::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, transparent, rgba(120,50,255,.06), transparent, rgba(255,50,120,.06), transparent);
            animation: spinSlow 15s linear infinite;
            pointer-events: none;
        }

        /* Progress bar animated */
        #progress-bar.active {
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* Play button breathing */
        #btn-play.playing { animation: breathe 2s ease-in-out infinite; }

        /* Lyric text entry */
        .lyric-enter { animation: lyricIn 0.5s cubic-bezier(.16,1,.3,1) forwards; }
        @keyframes lyricIn {
            from { opacity: 0; transform: translateY(12px) scale(.96); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* Progress touch */
        #progress-container {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #progress-container.dragging #progress-bar {
            transition: none !important;
        }
    </style>
</head>

        // ===== Update Widget with animation =====
        function updateWidget(type) {
            widgetCard.style.opacity = '0';
            widgetCard.style.transform = 'translateY(10px) scale(.97)';
            setTimeout(() => {
                widgetCard.innerHTML = renderWidget({ type });
                lucide.createIcons();
                widgetCard.style.opacity = '1';
                widgetCard.style.transform = 'translateY(0) scale(1)';
            }, 180);
        }

        // ===== Update Lyrics =====
        function updateLyrics(index) {
            if (index === currentIndex) return;
            currentIndex = index;
            const data = lyricsData[index];
            if (!data) return;

            lyricContainer.classList.remove('lyric-enter');
            void lyricContainer.offsetWidth;
            lyricContainer.classList.add('lyric-enter');

            lyricText.textContent = `"${data.text}"`;
            lyricTranslation.textContent = `(${data.translation})`;
            updateWidget(data.widget.type);
        }

        // ===== Time format =====
        function formatTime(sec) {
            if (isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // ===== Sync lyrics with audio =====
        function syncLyrics() {
            const t = audio.currentTime;
            let idx = 0;
            for (let i = 0; i < lyricsData.length; i++) {
                if (t >= lyricsData[i].startTime) idx = i;
                else break;
            }
            updateLyrics(idx);
        }

        // ===== Audio events =====
        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            const t = audio.currentTime;
            const d = audio.duration || 1;
            if (!isSeeking) {
                progressBar.style.width = `${(t / d) * 100}%`;
            }
            currentTimeEl.textContent = formatTime(t);
            syncLyrics();
        });

        audio.addEventListener('play', () => {
            playIcon.setAttribute('data-lucide', 'pause');
            lucide.createIcons();
            btnPlay.classList.add('playing');
            btnPlay.classList.remove('animate-pulse-glow');
            progressBar.classList.add('active');
        });

        audio.addEventListener('pause', () => {
            playIcon.setAttribute('data-lucide', 'play');
            lucide.createIcons();
            btnPlay.classList.remove('playing');
            btnPlay.classList.add('animate-pulse-glow');
            progressBar.classList.remove('active');
        });

        audio.addEventListener('ended', () => {
            playIcon.setAttribute('data-lucide', 'play');
            lucide.createIcons();
            btnPlay.classList.remove('playing');
            btnPlay.classList.add('animate-pulse-glow');
            progressBar.classList.remove('active');
            progressBar.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            currentIndex = -1;
            audio.currentTime = 0;
            updateLyrics(0);
        });

        // ===== Play button =====
        btnPlay.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        });

        // ===== Seek: клик + свайп (touch) =====
        let isSeeking = false;

        function seekFromClientX(clientX) {
            const rect = progressContainer.getBoundingClientRect();
            let ratio = (clientX - rect.left) / rect.width;
            ratio = Math.max(0, Math.min(1, ratio));
            if (audio.duration) {
                progressBar.style.width = `${ratio * 100}%`;
                currentTimeEl.textContent = formatTime(ratio * audio.duration);
            }
            return ratio;
        }

        function applySeek(clientX) {
            const ratio = seekFromClientX(clientX);
            if (audio.duration) {
                audio.currentTime = ratio * audio.duration;
                syncLyrics();
            }
        }

        // Клик
        progressContainer.addEventListener('click', (e) => {
            applySeek(e.clientX);
        });

        // Touch
        progressContainer.addEventListener('touchstart', (e) => {
            isSeeking = true;
            progressContainer.classList.add('dragging');
            applySeek(e.touches[0].clientX);
            e.preventDefault();
        }, { passive: false });

        progressContainer.addEventListener('touchmove', (e) => {
            if (!isSeeking) return;
            seekFromClientX(e.touches[0].clientX);
            e.preventDefault();
        }, { passive: false });

        progressContainer.addEventListener('touchend', (e) => {
            if (!isSeeking) return;
            isSeeking = false;
            progressContainer.classList.remove('dragging');
            const touch = e.changedTouches[0];
            applySeek(touch.clientX);
        });

        // Mouse drag (для десктопа)
        let isMouseDown = false;
        progressContainer.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            isSeeking = true;
            progressContainer.classList.add('dragging');
            seekFromClientX(e.clientX);
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            seekFromClientX(e.clientX);
        });
        window.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            isSeeking = false;
            progressContainer.classList.remove('dragging');
            applySeek(e.clientX);
        });

        // ===== Init =====
        lucide.createIcons();
        updateLyrics(0);

        if (audio.readyState >= 1) {
            totalTimeEl.textContent = formatTime(audio.duration);
        }
    </script>
